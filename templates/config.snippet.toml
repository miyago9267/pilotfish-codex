# Pilotfish native Codex Multi-Agent configuration for Codex 0.147+.
# Merge these keys and tables into ~/.codex/config.toml.
model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "xhigh"

# Child concurrency: the root plus up to three children.
max_concurrent_threads_per_session = 3

[features]
# Enable Codex's native decision card in Default mode.
default_mode_request_user_input = true

# Optional Astra main-session mode (zero-write and session-only; do not merge
# these overrides).
# codex --model gpt-6-astra \
#   -c model_reasoning_effort="high" \
#   -c plan_mode_reasoning_effort="high" \
#   -c max_concurrent_threads_per_session=1
# The 12-call / 300-second Astra budget in the prompt is advisory, not a
# provider-enforced quota. Remove the overrides and start a new session to use
# the normal Luna/Sol policy.
