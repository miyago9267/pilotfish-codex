name: Python tests

on:
  pull_request:
    paths:
      - "install/**"
      - "hooks/**"
      - "templates/**"
      - "plugin/**"
      - "tests/**"
      - "docs/specs/dispatch-verification/**"
      - "docs/specs/prompt-document-lock/**"
      - ".github/workflows/python-tests.yml"
  push:
    branches:
      - main
    paths:
      - "install/**"
      - "hooks/**"
      - "templates/**"
      - "plugin/**"
      - "tests/**"
      - "docs/specs/dispatch-verification/**"
      - "docs/specs/prompt-document-lock/**"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m py_compile hooks/pilotfish_autoroute_gate.py install/install.py install/probe_hybrid_runtime.py install/validate_agents.py install/verify_dispatch.py install/evaluate_dispatch.py install/validate_prompt_lock.py

      - name: Enforce prompt document lock
        env:
          PROMPT_LOCK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python install/validate_prompt_lock.py --base-ref "${PROMPT_LOCK_BASE}"

      - name: Check shell syntax
        if: runner.os != 'Windows'
        run: bash -n install/install.sh

      - name: Check PowerShell entrypoint
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install/install.ps1 --help

      - name: Validate packaged configuration
        run: python install/validate_agents.py
